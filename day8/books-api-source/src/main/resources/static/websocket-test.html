<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Test</title>
    <style>
        body { font-family: Arial; margin: 20px; background: #f0f0f0; }
        .box { background: white; padding: 20px; margin: 10px 0; border-radius: 8px; }
        input, button { padding: 10px; margin: 5px; font-size: 14px; }
        #messages { max-height: 300px; overflow-y: auto; padding: 10px; background: #fafafa; }
        .msg { padding: 5px; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>
<h1>📡 WebSocket Test — Books API</h1>

<div class="box">
    <h3>Chat (Bi-directional)</h3>
    <input id="sender" placeholder="Name" value="Anas">
    <input id="content" placeholder="Message" value="Hello!">
    <button onclick="sendMessage()">Send</button>
    <div id="messages"></div>
</div>

<div class="box">
    <h3>Broadcast (Uni-directional)</h3>
    <button onclick="fetch('/api/ws/broadcast').then(r=>r.text()).then(alert)">Trigger Broadcast</button>
    <button onclick="fetch('/api/ws/live-books').then(r=>r.text()).then(alert)">Live Books</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
<script>
    const client = new StompJs.Client({
        webSocketFactory: () => new SockJS('http://localhost:8080/ws'),
        onConnect: () => {
            addMessage('System', '✅ Connected');
            client.subscribe('/topic/chat', m => { const d = JSON.parse(m.body); addMessage(d.sender, d.content); });
            client.subscribe('/topic/books/count', m => { const d = JSON.parse(m.body); addMessage('Books', 'Total: ' + d.count); });
            client.subscribe('/topic/notifications', m => { const d = JSON.parse(m.body); addMessage('Broadcast', d.message); });
            client.subscribe('/topic/books/live', m => { const d = JSON.parse(m.body); addMessage('Live', d.books.length + ' books'); });
        }
    });
    client.activate();

    function sendMessage() {
        client.publish({
            destination: '/app/chat',
            body: JSON.stringify({
                sender: document.getElementById('sender').value,
                content: document.getElementById('content').value
            })
        });
    }

    function addMessage(from, text) {
        const div = document.createElement('div');
        div.className = 'msg';
        div.innerHTML = `<b>${from}:</b> ${text}`;
        document.getElementById('messages').prepend(div);
    }
</script>
</body>
</html>
