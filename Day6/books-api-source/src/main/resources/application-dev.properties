# Development Profile
spring.datasource.url=jdbc:mysql://localhost:3306/books_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=books_user
spring.datasource.password=Book@1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

logging.level.root=INFO
logging.level.com.internship.books_api=DEBUG

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=1234567890-abcdefg.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-secret=GOCSPX-yourRealSecretHere
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Cache Configuration (Caffeine)
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=600s
spring.cache.cache-names=books,booksById
